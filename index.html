<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Logicsify designs websites, web applications, SaaS products, AI automations, and digital marketing systems that help businesses grow."
    />
    <link rel="icon" href="/logicsify-mark.png" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link
      rel="preload"
      href="/fonts/sora-latin-variable.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <script data-logicsify-mobile-ui-reliability>
      (() => {
        const lightLogo = "/logicsify-logo-light.png";
        const backendUploads = "https://backend.logicsify.com/uploads/";

        // Safari/mobile recovery: if a same-origin media route fails, retry the
        // underlying static upload directly once instead of leaving a broken image.
        document.addEventListener(
          "error",
          (event) => {
            const image = event.target;
            if (!(image instanceof HTMLImageElement) || image.dataset.logicsifyMediaRetry === "1") return;

            try {
              const source = image.currentSrc || image.src;
              const url = new URL(source, window.location.origin);
              if (url.origin !== window.location.origin) return;

              let relativePath = "";
              if (url.pathname.startsWith("/media/")) {
                relativePath = url.pathname.slice("/media/".length);
              } else if (url.pathname.startsWith("/uploads/")) {
                relativePath = url.pathname.slice("/uploads/".length);
              }

              if (!relativePath || relativePath.split("/").some((segment) => segment === "..")) return;

              image.dataset.logicsifyMediaRetry = "1";
              image.removeAttribute("srcset");
              image.src = `${backendUploads}${relativePath}${url.search}`;
            } catch {
              // Preserve the browser's normal broken-image behavior for unknown URLs.
            }
          },
          true,
        );

        // The official light wordmark is designed for a dark surface. Keep the
        // mobile drawer body light, but give its brand strip a dark background so
        // the complete light logo remains visible instead of only showing the mark.
        const applyMobileDrawerBranding = () => {
          const closeButton = document.querySelector('button[aria-label="Close menu"]');
          if (!(closeButton instanceof HTMLElement)) return;

          const drawerHeader = closeButton.parentElement;
          if (!(drawerHeader instanceof HTMLElement)) return;

          drawerHeader.style.backgroundColor = "#000000";
          drawerHeader.style.borderColor = "rgba(255,255,255,0.12)";
          closeButton.style.color = "#ffffff";
          closeButton.style.borderColor = "rgba(255,255,255,0.22)";

          const drawerLogo = drawerHeader.querySelector("img");
          if (drawerLogo instanceof HTMLImageElement && drawerLogo.getAttribute("src") !== lightLogo) {
            drawerLogo.removeAttribute("srcset");
            drawerLogo.src = lightLogo;
          }
        };

        // Dropdown items such as "Who We Are" are not mega menus. The React
        // fallback grouper can otherwise expose internal placeholders such as
        // "Column 1" ... "Column 5" on mobile. Remove only those generated
        // headings while keeping the actual About/Team links untouched.
        const cleanupMobileMenuColumns = () => {
          const closeButton = document.querySelector('button[aria-label="Close menu"]');
          if (!(closeButton instanceof HTMLElement)) return;

          const drawerHeader = closeButton.parentElement;
          const nav = drawerHeader?.nextElementSibling;
          if (!(nav instanceof HTMLElement)) return;

          const whoWeAre = Array.from(nav.querySelectorAll("details")).find((details) => {
            const summary = details.querySelector("summary");
            return summary?.textContent?.trim() === "Who We Are";
          });
          if (!(whoWeAre instanceof HTMLElement)) return;

          whoWeAre.querySelectorAll("p").forEach((heading) => {
            if (!/^Column\s+\d+$/i.test(heading.textContent?.trim() || "")) return;
            const group = heading.parentElement;
            if (group instanceof HTMLElement && group.children.length === 1) {
              group.remove();
            } else {
              heading.remove();
            }
          });
        };

        const applyMobileUiFixes = () => {
          applyMobileDrawerBranding();
          cleanupMobileMenuColumns();
        };

        const observer = new MutationObserver(applyMobileUiFixes);
        observer.observe(document.documentElement, {
          childList: true,
          subtree: true,
          attributes: true,
          attributeFilter: ["src"],
        });
        document.addEventListener("DOMContentLoaded", applyMobileUiFixes, { once: true });
      })();
    </script>
    <title>Logicsify | Web Development, AI Automation & Digital Marketing</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
